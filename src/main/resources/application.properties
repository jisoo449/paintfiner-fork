#JPA
#update or create
spring.jpa.hibernate.ddl-auto=update
# ddl-auto 속성 사용할 건지. true 면 사용, false 가 기본값
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
#실행시 쿼리문 보이게
spring.jpa.hibernate.properties.hibernate.format_sql=true
spring.jpa.database=mysql
#카멜케이스를 스네이크케이스로 변환 (논리)
spring.jpa.hibernate.naming.strategy=org.hibernate.cfg.ImprovedNamingStrategy
#(물리)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#지연로딩 사용을 위해 즉시로딩 사용시 n1문제 발생 원인이 될 수 있음
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# acator-spring fox 충돌 해결 위함
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://${RDS.DOMAIN}:3306/PFDB?autoReconnect=true
spring.datasource.username=${MYSQL.USERNAME}
spring.datasource.password=${MYSQL.PASSWORD}
#spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy

mybatis.type-aliases-package=com.paintfinder.**.vo
mybatis.mapper-locations=classpath*:mapper/**/*.xml

spring.security.user.name=${SECURITY.USERNAME}
spring.security.user.password=${SECURITY.PASSWORD}

cloud.aws.credentials.accessKey=${S3.ACCESSKEY}
cloud.aws.credentials.secretKey=${S3.SECRETKEY}
cloud.aws.region.static=${S3.REGION}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

#S3 ??? ec2 metadata ???? ?? ?? ????
logging.level.com.amazonaws.util.EC2MetadataUtils=error
cloud.aws.stack.auto=false

# acuator: 헬스 체크 엔드포인트 활성화
management.endpoints.web.exposure.include=health

# jpa 시간대 설정
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

