#       run: |
#         echo $CREDENTIALS >> application_key.properties
#       env:
#         CREDENTIALS: "${{ secrets.PROPERTIES_KEY_ENCODE }} | base64 --decode"
#       shell: bash
      
#      ## create gitignore secrets key
#     - name: make application_key.properties
#       run: |
#           cd ./src/main/resources
#           echo "EC2.DOMAIN=$EC2_DOMAIN">> .application_key.properties
#           echo "MYSQL.USERNAME=$MYSQL_USERNAME">> .application_key.properties
#           echo "MYSQL.PASSWORD=$MYSQL_PASSWORD">> .application_key.properties
#           echo "S3.URL=$S3_URL">> .application_key.properties
#           echo "S3.BUCKETNAME=$S3_BUCKETNAME">> .application_key.properties
#           echo "S3.REGION=$S3_REGION">> .application_key.properties
#           echo "S3.ACCESSKEY=$S3_ACCESSKEY">> .application_key.properties
#           echo "S3.SECRETKEY=$S3_SECRETKEY">> .application_key.properties
#           echo "SECURITY.USERNAME=$SECURITY_USERNAME">> .application_key.properties
#           echo "SECURITY.PASSWORD=$SECURITY_PASSWORD">> .application_key.properties
#       env:
#           EC2_DOMAIN: ${{ secrets.EC2_DOMAIN}}
#           MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
#           MYSQL_PASSWORD: S{{ secrets.MYSQL_PASSWORD }}
#           S3_URL: ${{ secrets.S3_URL }}
#           S3_BUCKETNAME: ${{ secrets.S3_BUCKETNAME}}
#           S3_REGION: ${{ secrets.S3_REGION }}
#           S3_ACCESSKEY: ${{ secrets.S3_ACCESSKEY }}
#           S3_SECRETKEY: ${{ secrets.S3_SECRETKEY }}
#           SECURITY_USERNAME: ${{ secrets.SECURITY_USERNAME }}
#           SECURITY_PASSWORD: ${{ secrets.SECURITY_PASSWORD }}
#       shell: bash
      
    # gradlew 권한 추가
    - name: Change wrapper permissions
      run: chmod +x ./gradlew
    
    
    # Gradle build
    - name: Build with Gradle
      run: ./gradlew build -x test
#       uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
#       with:
#         arguments: build

    ## Docker Login
    #- name: Login to Docker Hub
    #  run : echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin docker.io

    # docker build & push
    - name: Docker build & push
      if: contains(github.ref, 'main') # main 브랜치에 push할 때만 실행
      run: |
        docker login -u "${{secrets.DOCKER_USERNAME}}" -p "${{secrets.DOCKER_PASSWORD}}" docker.io
        docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO}} .
        docker push ${{ secrets.DOCKER_REPO }}:latest
        
    # deploy
    - name: Deploy
      uses: appleboy/ssh-action@master
      id: deploy
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        password: ${{ secrets.PASSWORD }}
        #port: 22
        script: |
          cd /home/ubuntu
          docker compose pull app
          docker compose up -d
          docker image prune -f
          docker container prune -f
          docker volume prune -f
          docker network prune -f
