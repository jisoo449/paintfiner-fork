name: CI/CD

# event trigger 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: self-hosted #ubuntu-latest
    
    # jdk setting
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    ## gradle caching
    - name: Gradle Caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    ## create application_key.properties
    - name: make application_key.properties
#       if: contains(github.ref, 'develop') # branch가 develop일 때
      run: |
        cd ./src/main/resources 
        # spring의 resources 경로로 이동
        ls
        
        # application_key.properties 파일 생성
        touch ./application_key.properties
        
        # GitHub-Actions에서 설정한 값을 application.properties 파일에 쓰기
        echo "${{ secrets.PROPERTIES_KEY }}" > ./application_key.properties 
      shell: bash
      
#        ## create application_key.properties
